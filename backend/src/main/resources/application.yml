server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: blindspot-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/blindspot_db}
      database: ${SPRING_DATA_MONGODB_DATABASE:blindspot_db}
      auto-index-creation: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  models: ${GEMINI_MODELS:gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.8-flash,gemini-3.5-flash}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,https://*.onrender.com}
